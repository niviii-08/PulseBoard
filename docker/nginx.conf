# Serves the built React SPA and proxies /api/v1/* to the backend
# container so the browser only ever talks to one origin -- avoiding
# CORS entirely in this docker-compose setup (the backend's
# BACKEND_CORS_ORIGINS allowlist is still enforced and still matters for
# any deployment where the frontend ISN'T proxied through the same
# origin, e.g. a CDN-hosted frontend calling a separately-hosted API).

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing: any path that isn't a real static file falls back to
    # index.html so React Router (not nginx) decides what to render --
    # without this, a hard refresh on e.g. /incidents/abc123 would 404
    # at the nginx level before React ever gets a chance to handle it.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets get long-lived caching -- Vite fingerprints build
    # output filenames (e.g. index-a1b2c3.js), so a new deploy naturally
    # gets a new URL and this cache header can be aggressive without
    # risking someone getting stuck on stale JS.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Plain HTTP proxy for the REST API. `backend` resolves via Docker
    # Compose's built-in DNS to whatever container is running the `api`
    # service -- see docker-compose.yml.
    location /api/v1/ {
        proxy_pass http://backend:8000/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket upgrade for GET /api/v1/ws/status -- needs the
    # Upgrade/Connection headers explicitly forwarded, which the plain
    # HTTP proxy_pass block above does not do by default. Matched as its
    # own, more specific location so it doesn't fall through to the
    # generic /api/v1/ block above.
    location /api/v1/ws/ {
        proxy_pass http://backend:8000/api/v1/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # WebSocket connections are long-lived by design -- nginx's
        # default proxy_read_timeout (60s) would silently kill an idle
        # (but still-open) connection well before that's actually
        # desired for a live status feed.
        proxy_read_timeout 3600s;
    }
}
